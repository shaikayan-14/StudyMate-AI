<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Tasks - StudyMate AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>


<body>


<div class="dashboard">


<header>

<div class="logo">
🤖 StudyMate AI
</div>


<div class="profile">
✅ Task Manager
</div>

</header>



<div class="content">


<section class="ai-card">


<h1>
✅ Today's Tasks
</h1>



<form method="POST">


<input 
type="text"
name="task"
placeholder="Enter your task..."
required>


<button>
Add Task
</button>


</form>



<div class="task-list">


{% for task in tasks %}


<div class="task-item">


<div>

<h3>
📌 {{ task[2] }}
</h3>


<p>
Status: {{ task[3] }}
</p>

</div>



<a href="/delete_task/{{task[0]}}">
❌
</a>


</div>


{% endfor %}


</div>


</section>


</div>


</div>


</body>

</html>
