<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - StudyMate AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>


<body>


<div class="auth-box">


<h1>Welcome Back 🤖</h1>


<form method="POST">


<input 
type="email"
name="email"
placeholder="Email Address"
required>


<input 
type="password"
name="password"
placeholder="Password"
required>


<button type="submit">
Login
</button>


</form>


<a href="/register">
Create New Account
</a>


</div>


</body>

</html>
