<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyMate AI Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

<div class="dashboard">

    <!-- Header -->
    <header>

        <div class="logo">
            🤖 StudyMate AI
        </div>

        <div class="profile">
            AI Assistant
        </div>

    </header>

    <!-- Content -->
    <div class="content">

        <section class="ai-card">

            <h1>🤖 StudyMate AI Assistant</h1>

            <p>
                Ask any question related to programming, engineering, mathematics,
                science, or your studies.
            </p>

            <form method="POST">

                <input
                    type="text"
                    name="question"
                    placeholder="Ask your study question..."
                    required
                >

                <button type="submit">
                    🚀 Ask AI
                </button>

            </form>

            {% if answer %}

            <div class="result-card">

                <h2>🤖 AI Response</h2>

                <p>{{ answer }}</p>

            </div>

            {% endif %}

        </section>

    </div>

</div>

</body>

</html>
